<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NutriCart | Healthy Meal Kit Subscription Platform</title>
    <meta name="description" content="NutriCart is a healthy meal kit subscription and e-commerce platform with meal plans, cart checkout, delivery tracking and admin tools.">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" data-link aria-label="NutriCart home">
        <span class="brand-mark">N</span>
        <span>NutriCart</span>
      </a>
      <button class="menu-toggle" type="button" data-menu-toggle aria-label="Toggle menu">Menu</button>
      <nav class="nav" data-nav aria-label="Primary navigation">
        <a href="/" data-link>Home</a>
        <a href="/meals" data-link>Meal kits</a>
        <a href="/subscriptions" data-link>Subscriptions</a>
        <a href="/tracking" data-link>Tracking</a>
        <a href="/blog" data-link>Health tips</a>
        <a href="/corporate" data-link>Corporate</a>
        <a href="/admin" data-link>Admin</a>
      </nav>
      <a class="cart-link" href="/cart" data-link aria-label="Open cart">
        <span class="cart-symbol" aria-hidden="true"></span>
        <span id="cartCount">0</span>
      </a>
    </header>

    <main id="app" tabindex="-1"></main>

    <aside id="toast" class="toast" aria-live="polite" aria-hidden="true"></aside>

    <script src="/app.js" defer></script>
  </body>
</html>
